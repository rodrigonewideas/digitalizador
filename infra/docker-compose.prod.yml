# PRODUÇÃO — deploy do servidor (Bonfim). Não usa mount de código nem reload.
# Uso no servidor:
#   cd infra && cp .env.prod.example .env  &&  editar segredos
#   docker compose -f docker-compose.prod.yml up --build -d
name: digitalizador

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    # Sem porta publicada: o banco só é acessível pela rede interna do compose.

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DIGITALIZADOR_SCHEMA_SQL: /app/database/schema.sql
    depends_on:
      db:
        condition: service_healthy
    # Aplica migrations e sobe a API (sem reload)
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    volumes:
      # Disco de imagens (700 GB, montado em /data no host) — guarda definitiva
      - /data/storage:/data/storage
    restart: unless-stopped
    # Sem porta publicada: acessível só via Nginx (serviço frontend).

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    restart: unless-stopped

volumes:
  pgdata:
