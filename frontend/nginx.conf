server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads de documentos podem ser grandes
    client_max_body_size 100m;

    # SPA: qualquer rota do react-router cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend (mesma origem; o frontend chama /api/v1 relativo)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Ativos estáticos com cache longo (o Vite versiona os nomes)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
