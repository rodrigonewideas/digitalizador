# Configuração do Alembic — Digitalizador Bonfim Web
# A URL de conexão NÃO fica aqui; é lida de DATABASE_URL em migrations/env.py
# (ver infra/ para o .env). Rodar a partir de backend/:  alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Formato do nome dos arquivos de versão: 0002_descricao.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
