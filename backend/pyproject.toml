[project]
name = "digitalizador-backend"
version = "0.1.0"
description = "Backend (API) do Digitalizador Bonfim Web"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",     # hash de senha (Argon2id)
    "pyjwt>=2.9",            # tokens JWT
    "python-multipart>=0.0.9",
    "cryptography>=43.0",    # PKCS#12 (A1) e cifragem em repouso (Fernet)
    "pyhanko>=0.25",         # assinatura PAdES de PDF
    "pypdf>=5.0",            # manipulação de PDF (páginas)
    "pdfminer.six>=20240706",# detecção de conteúdo no rodapé
    "reportlab>=4.2",        # geração de PDF base / carimbo
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---- Padrão de código (ver docs/03-PADROES-DE-DESENVOLVIMENTO.md) -------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
